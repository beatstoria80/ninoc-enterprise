function makeEls(prod,style,srcFile){
  const f=prod.features;
  const h=prod.label;
  const subMap={jogger_waffle:"TEKSTUR SERIES",setelan_dryfit:"DRY-FIT SERIES",jersey_dryfit:"PERFORMANCE SERIES",manset_thumbhole:"THUMBHOLE SERIES",manset_standar:"BASELAYER SERIES",training_hypebeast:"HYPEBEAST SERIES",polo_scuba:"SMART CASUAL SERIES"};
  const sub=subMap[prod.id]||"NEW COLLECTION";
  return [
    {type:"text",content:h.toUpperCase(),font:style.font_h,size_px:style.cat==="Elegant"?54:72,color:style.bg==="#FFFFFF"||style.bg==="#F5F3EE"||style.bg==="#C0C0C8"||style.bg==="#E8E0D0"||style.bg==="#EAF4FF"||style.bg==="#F0F5FF"||style.bg==="#FFF0F8"||style.bg==="#F2F5EE"?"#1A1A1A":"#FFFFFF",position:"top_center",y_offset:-190,animation:{start:0.4,effect:style.cat==="Futuristic"?"glitch_pop":style.cat==="Retro"?"slam_in":"pop_in_scale",duration:1.0}},
    {type:"text",content:sub,font:style.font_s,size_px:12,color:style.accent,tracking_px:10,position:"below_headline",y_offset:-128,animation:{start:1.0,effect:"fade_in"}},
    {type:"feature_list",style:style.shape,items:f,font:style.font_s,size_px:9,color:style.accent,position:"bottom_left",y_offset:75,animation:{start:2.8,effect:"sequential_pop",stagger:0.15}},
    {type:"color_swatches",style:style.swatch_style,swatches:prod.color_note,position:"bottom_right",y_offset:145,animation:{start:4.5,effect:"slide_up_fade"}}
  ];
}

// Pre-build VO index per category untuk rotasi bervariasi
const VO_BY_CAT={};
VO_POOL.forEach(vo=>{
  vo.cats.forEach(cat=>{
    if(!VO_BY_CAT[cat]) VO_BY_CAT[cat]=[];
    VO_BY_CAT[cat].push(vo);
  });
});

function pickVO(cat,prodIdx,styleIdx){
  const pool=VO_BY_CAT[cat]||VO_POOL;
  // rotasi: tiap produk mulai dari offset berbeda agar tidak monoton
  const offset=(prodIdx*3+styleIdx)%pool.length;
  return pool[offset];
}

function buildEntry(prod,style,voIdx,prodIdx,styleIdx){
  const srcFile=prod.src_options[0];
  const voEntry=pickVO(style.cat,prodIdx,styleIdx);
  const vo=voEntry.tmpl(prod.label,prod.color_note,prod.voice_gender);
  const els=makeEls(prod,style,srcFile);
  return {
    video:{duration_seconds:10,resolution:"1080x1920",frame_rate:30,background_color:style.bg,style:style.label.toLowerCase()},
    scenes:[{id:"scene_1",start:0,end:10,background:{type:"solid",color:style.bg},product:{type:"image",src:srcFile,position:"center",scale:0.97,animation:{start:0,effect:"slow_zoom_in",duration:10,easing:"ease_out"}},elements:els}],
    voice_over:{...vo,vo_tag:voEntry.tag,category:style.cat,style:style.cat.toLowerCase()+"_"+prod.voice_gender,background_music:{track:style.mus,volume:style.mv}},
    transitions:[],
    export:{format:"mp4",codec:"h264",quality:"high"}
  };
}

const MASTER=[];
PRODUCTS.forEach((prod,prodIdx)=>{
  STYLES.forEach((style,styleIdx)=>{
    MASTER.push({prod,style,prodIdx,styleIdx,id:MASTER.length+1});
  });
});

let bCur=0,fCur=0,fFiltered=[...MASTER],crList=[],crCur=0;
let fProdFilter="all",fCatFilter="all",fSearchTerm="";

function switchTab(t){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+t).classList.add('on');
  const tabs={browse:0,filter:1,caption:2,custom:3,custom_result:4};
  const tabIdx = tabs[t];
  if(tabIdx !== undefined) document.querySelectorAll('.tab')[tabIdx].classList.add('on');
  if(t==='filter'){buildFilterUI();}
}

function buildStatRow(){
  const el=document.getElementById('statRow');
  el.innerHTML=`
    <div class="stat"><div class="stat-n">${MASTER.length}</div><div class="stat-l">Total variasi</div></div>
    <div class="stat"><div class="stat-n">${PRODUCTS.length}</div><div class="stat-l">Produk</div></div>
    <div class="stat"><div class="stat-n">${STYLES.length}</div><div class="stat-l">Style unik</div></div>
    <div class="stat"><div class="stat-n">${VO_POOL.length}</div><div class="stat-l">Script VO</div></div>
  `;
}

function buildBrowseNav(){
  const el=document.getElementById('navRow');
  const start=Math.max(0,bCur-4);
  const end=Math.min(MASTER.length,start+10);
  let h='';
  if(start>0) h+=`<button class="nb" onclick="bJump(0)">1</button><span style="font-size:11px;color:var(--color-text-secondary)">...</span>`;
  for(let i=start;i<end;i++) h+=`<button class="nb ${i===bCur?'on':''}" onclick="bJump(${i})">${MASTER[i].id}</button>`;
  if(end<MASTER.length) h+=`<span style="font-size:11px;color:var(--color-text-secondary)">...</span><button class="nb" onclick="bJump(${MASTER.length-1})">${MASTER.length}</button>`;
  el.innerHTML=h;
}

function bJump(i){bCur=i;buildBrowseNav();bRender();}
function bNav(d){bCur=Math.max(0,Math.min(MASTER.length-1,bCur+d));buildBrowseNav();bRender();}

function bRender(){
  const e=MASTER[bCur];
  const j=buildEntry(e.prod,e.style,0,e.prodIdx,e.styleIdx);
  const voEntry=pickVO(e.style.cat,e.prodIdx,e.styleIdx);
  document.getElementById('bVlabel').textContent=`#${e.id} — ${e.style.label}`;
  document.getElementById('bProd').textContent=e.prod.label;
  document.getElementById('bCat').textContent=e.style.cat;
  document.getElementById('bStyle').textContent=e.style.id;
  document.getElementById('bVo').textContent=voEntry.tag;
  document.getElementById('bSrc').textContent=e.prod.src_options[0];
  document.getElementById('bBg').textContent=e.style.bg;
  document.getElementById('bMus').textContent=e.style.mus;
  document.getElementById('bVoice').textContent=j.voice_over.voice;  document.getElementById('bJson').textContent=JSON.stringify(j,null,2);
  document.getElementById('bPgInfo').textContent=`${bCur+1} / ${MASTER.length}`;
  document.getElementById('bPrev').disabled=bCur===0;
  document.getElementById('bNext').disabled=bCur===MASTER.length-1;
  const cb=document.getElementById('bCopyBtn');cb.textContent='Copy JSON';cb.className='copybtn';
}

function bCopy(){
  const j=buildEntry(MASTER[bCur].prod,MASTER[bCur].style,0,MASTER[bCur].prodIdx,MASTER[bCur].styleIdx);
  navigator.clipboard.writeText(JSON.stringify(j,null,2)).then(()=>{
    const b=document.getElementById('bCopyBtn');b.textContent='✓ Copied!';b.className='copybtn ok';
    setTimeout(()=>{b.textContent='Copy JSON';b.className='copybtn';},2000);
  });
}

function buildFilterUI(){
  const prods=['all',...PRODUCTS.map(p=>p.id)];
  document.getElementById('prodFilter').innerHTML=prods.map(p=>{
    const lbl=p==='all'?`Semua (${MASTER.length})`:PRODUCTS.find(x=>x.id===p).label;
    return `<button class="chip ${fProdFilter===p?'on':''}" onclick="setProdFilter('${p}')">${lbl}</button>`;
  }).join('');
  const cats=['all',...[...new Set(STYLES.map(s=>s.cat))]];
  document.getElementById('catFilter').innerHTML=cats.map(c=>{
    const lbl=c==='all'?'Semua style':c;
    return `<button class="chip ${fCatFilter===c?'on':''}" onclick="setCatFilter('${c}')">${lbl}</button>`;
  }).join('');
  applyFilter();
}

function setProdFilter(v){fProdFilter=v;fCur=0;buildFilterUI();}
function setCatFilter(v){fCatFilter=v;fCur=0;buildFilterUI();}

function applyFilter(){
  const term=document.getElementById('searchInput')?.value?.toLowerCase()||'';
  fSearchTerm=term;
  fFiltered=MASTER.filter(e=>{
    const matchProd=fProdFilter==='all'||e.prod.id===fProdFilter;
    const matchCat=fCatFilter==='all'||e.style.cat===fCatFilter;
    const matchSearch=!term||(e.prod.label.toLowerCase().includes(term)||e.style.label.toLowerCase().includes(term)||e.style.cat.toLowerCase().includes(term));
    return matchProd&&matchCat&&matchSearch;
  });
  fCur=0;
  document.getElementById('filtCount').textContent=`Hasil: ${fFiltered.length} variasi`;
  buildFNav();fRender();
}

function buildFNav(){
  const el=document.getElementById('fNavRow');
  el.innerHTML=fFiltered.slice(0,20).map((e,i)=>
    `<button class="nb ${i===fCur?'on':''}" onclick="fJump(${i})">${e.id}</button>`
  ).join('')+(fFiltered.length>20?`<span style="font-size:11px;color:var(--color-text-secondary)">+${fFiltered.length-20} lagi</span>`:'');
}

function fJump(i){fCur=i;buildFNav();fRender();}
function fNav(d){if(!fFiltered.length)return;fCur=Math.max(0,Math.min(fFiltered.length-1,fCur+d));buildFNav();fRender();}

function fRender(){
  if(!fFiltered.length){
    document.getElementById('fVlabel').textContent='Tidak ada hasil';
    document.getElementById('fJson').textContent='{}';
    document.getElementById('fPgInfo').textContent='0 / 0';
    return;
  }
  const e=fFiltered[fCur];
  const j=buildEntry(e.prod,e.style,0,e.prodIdx,e.styleIdx);
  document.getElementById('fVlabel').textContent=`#${e.id} — ${e.style.label}`;
  document.getElementById('fProd').textContent=e.prod.label;
  document.getElementById('fCat').textContent=e.style.cat;
  document.getElementById('fStyle').textContent=e.style.id;
  document.getElementById('fSrc').textContent=e.prod.src_options[0];
  document.getElementById('fBg').textContent=e.style.bg;
  document.getElementById('fJson').textContent=JSON.stringify(j,null,2);
  document.getElementById('fPgInfo').textContent=`${fCur+1} / ${fFiltered.length}`;
  document.getElementById('fPrev').disabled=fCur===0;
  document.getElementById('fNext').disabled=fCur===fFiltered.length-1;
  const cb=document.getElementById('fCopyBtn');cb.textContent='Copy JSON';cb.className='copybtn';
}

function fCopy(){
  if(!fFiltered.length)return;
  const e=fFiltered[fCur];
  navigator.clipboard.writeText(JSON.stringify(buildEntry(e.prod,e.style,0,e.prodIdx,e.styleIdx),null,2)).then(()=>{
    const b=document.getElementById('fCopyBtn');b.textContent='✓ Copied!';b.className='copybtn ok';
    setTimeout(()=>{b.textContent='Copy JSON';b.className='copybtn';},2000);
  });
}

function previewImg(input){
  const file=input.files[0];
  if(!file)return;
  document.getElementById('uploadTxt').textContent=file.name;
  const reader=new FileReader();
  reader.onload=e=>{const img=document.getElementById('imgPreview');img.src=e.target.result;img.style.display='block';};
  reader.readAsDataURL(file);
}

function buildCustomJSON(i,name,sub,desc,srcFile,features,colorNote,audience,tone,customVo,style){
  const voText=customVo||CUSTOM_VO[i%CUSTOM_VO.length](name,desc,colorNote);
  const timingMid=voText.split('.')[1]?.trim()||desc;
  const timingEnd=colorNote;
  const voiceMap={pria:"male_deep_premium_id",wanita:"female_warm_premium_id",remaja:"female_energetic_id",premium:"male_premium_id",unisex:"male_deep_premium_id"};
  return {
    video:{duration_seconds:10,resolution:"1080x1920",frame_rate:30,background_color:style.bg,style:style.label.toLowerCase()},
    scenes:[{id:"scene_1",start:0,end:10,
      background:{type:"solid",color:style.bg},
      product:{type:"image",src:srcFile||`${name.toLowerCase().replace(/ /g,'_')}.png`,position:"center",scale:0.97,animation:{start:0,effect:"slow_zoom_in",duration:10,easing:"ease_out"}},
      elements:[
        {type:"text",content:name.toUpperCase(),font:style.font_h,size_px:68,color:["#FFFFFF","#C0C0C8","#E8E0D0","#EAF4FF","#F5F3EE","#F0F5FF","#FFF0F8","#F2F5EE","#F8F0FF"].includes(style.bg)?"#1A1A1A":"#FFFFFF",position:"top_center",y_offset:-190,animation:{start:0.4,effect:"pop_in_scale",duration:1.0}},
        {type:"text",content:sub||"NEW COLLECTION",font:style.font_s,size_px:12,color:style.accent,tracking_px:10,position:"below_headline",y_offset:-128,animation:{start:1.0,effect:"fade_in"}},
        {type:"feature_list",style:style.shape,items:features.slice(0,6),font:style.font_s,size_px:9,color:style.accent,position:"bottom_left",y_offset:75,animation:{start:2.8,effect:"sequential_pop",stagger:0.15}},
        {type:"color_swatches",style:style.swatch_style,label:colorNote,position:"bottom_right",y_offset:145,animation:{start:4.5,effect:"slide_up_fade"}}
      ]
    }],
    voice_over:{
      script:voText,
      duration_seconds:10,
      voice:voiceMap[audience]||"male_deep_premium_id",
      style:tone+"_"+audience,
      timing:[
        {start:0.6,text:voText.split('.')[0]+"."},
        {start:3.5,text:timingMid.length>5?timingMid+".":desc+"."},
        {start:7.0,text:timingEnd}
      ],
      background_music:{track:style.mus,volume:style.mv}
    },
    custom_info:{product_name:name,subtitle:sub,description:desc,audience,tone,color_note:colorNote},
    transitions:[],
    export:{format:"mp4",codec:"h264",quality:"high"}
  };
}

function generateCustom(){
  const name=document.getElementById('cName').value.trim();
  const desc=document.getElementById('cDesc').value.trim();
  if(!name||!desc){alert('Nama produk dan deskripsi wajib diisi!');return;}
  const sub=document.getElementById('cSub').value.trim();
  const srcFile=document.getElementById('cSrc').value.trim();
  const featuresRaw=document.getElementById('cFeatures').value.trim();
  const colorsRaw=document.getElementById('cColors').value.trim();
  const audience=document.getElementById('cAudience').value;
  const tone=document.getElementById('cTone').value;
  const customVo=document.getElementById('cVo').value.trim();
  const count=parseInt(document.querySelector('input[name="varCount"]:checked').value);
  const features=featuresRaw?featuresRaw.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean):["PREMIUM QUALITY","DURABLE FABRIC","COMFORTABLE FIT","STYLISH DESIGN","EASY CARE","VERSATILE USE"];
  const colorNote=colorsRaw?`Tersedia dalam ${colorsRaw}`:"Tersedia dalam berbagai warna pilihan";
  crList=[];
  for(let i=0;i<count;i++){
    const style=CUSTOM_STYLE_POOL[i%CUSTOM_STYLE_POOL.length];
    crList.push(buildCustomJSON(i,name,sub,desc,srcFile,features,colorNote,audience,tone,customVo,style));
  }
  crCur=0;
  buildCrNav();crRender();
  switchTab('custom_result');
}

function buildCrNav(){
  document.getElementById('crNav').innerHTML=crList.map((_,i)=>
    `<button class="nb ${i===crCur?'on':''}" onclick="crJump(${i})">${i+1}</button>`
  ).join('');
}

function crJump(i){crCur=i;buildCrNav();crRender();}
function crNav(d){crCur=Math.max(0,Math.min(crList.length-1,crCur+d));buildCrNav();crRender();}

function crRender(){
  if(!crList.length)return;
  const j=crList[crCur];
  const style=CUSTOM_STYLE_POOL[crCur%CUSTOM_STYLE_POOL.length];
  document.getElementById('crTitle').textContent=`Hasil: ${crList.length} variasi — ${j.custom_info.product_name}`;
  document.getElementById('crVlabel').textContent=`Variant ${crCur+1}/${crList.length} — ${style.label}`;
  document.getElementById('crProd').textContent=j.custom_info.product_name;
  document.getElementById('crCat').textContent=style.cat;
  document.getElementById('crBg').textContent=style.bg;
  document.getElementById('crMus').textContent=style.mus;
  document.getElementById('crJson').textContent=JSON.stringify(j,null,2);
  document.getElementById('crPgInfo').textContent=`${crCur+1} / ${crList.length}`;
  document.getElementById('crCard').style.display='block';
  document.getElementById('crPager').style.display='flex';
  document.getElementById('crPrev').disabled=crCur===0;
  document.getElementById('crNext').disabled=crCur===crList.length-1;
  const cb=document.getElementById('crCopyBtn');cb.textContent='Copy JSON';cb.className='copybtn';
}

function crCopy(){
  if(!crList.length)return;
  navigator.clipboard.writeText(JSON.stringify(crList[crCur],null,2)).then(()=>{
    const b=document.getElementById('crCopyBtn');b.textContent='✓ Copied!';b.className='copybtn ok';
    setTimeout(()=>{b.textContent='Copy JSON';b.className='copybtn';},2000);
  });
}

function strHash(s){
  var h=0;
  for(var i=0;i<s.length;i++) h=Math.imul(31,h)+s.charCodeAt(i)|0;
  return Math.abs(h);
}

function pickCaption(pic,slot,tgl,produk){
  var db=CAP[produk.toUpperCase()];
  if(!db) return {headline:'(Err)',deskripsi:'',cta:'',hashtag:''};
  var n=db.h.length;
  var seed=strHash(pic+'|'+slot+'|'+tgl+'|'+produk);
  return {
    headline:  db.h[seed%n],
    deskripsi: db.d[(seed+1)%db.d.length],
    cta:       db.c[(seed+2)%db.c.length],
    hashtag:   db.t[(seed+3)%db.t.length]
  };
}

async function doGenerateCaptions(){
  const pics = Array.from(document.querySelectorAll('#capPicGrid .nb.on')).map(b=>b.textContent);
  const slots = Array.from(document.querySelectorAll('#capSlotGrid .nb.on')).map(b=>b.textContent);
  const dates = Array.from(document.querySelectorAll('#capDateGrid .nb.on')).map(b=>b.textContent);
  const prods = Array.from(document.querySelectorAll('#capProdGrid .nb.on')).map(b=>b.textContent);

  if(!pics.length || !slots.length || !dates.length || !prods.length){ alert('Lengkapi pilihan!'); return; }

  const combos = [];
  pics.forEach(pic => {
    dates.forEach(tgl => {
      slots.forEach(slot => {
        prods.forEach(prod => {
          combos.push({pic, tgl, slot, prod});
        });
      });
    });
  });

  const btn = document.getElementById('genCapBtn');
  const status = document.getElementById('capStatus');
  btn.disabled = true;
  status.textContent = `Generating ${combos.length} captions...`;

  const items = combos.map(c => {
    const cp = pickCaption(c.pic, c.slot, c.tgl, c.prod);
    return {
      pic: c.pic, akun: 'ALL', slot: c.slot, tanggal: c.tgl, produk: c.prod,
      headline: cp.headline, deskripsi: cp.deskripsi, cta: cp.cta, hashtag: cp.hashtag
    };
  });

  // Render Preview
  let h = '<div class="card" style="padding:15px"><h4>Preview (Top 10)</h4><table style="width:100%; font-size:10px; border-collapse:collapse; margin-top:10px">';
  items.slice(0, 10).forEach(it => {
    h += `<tr style="border-bottom:1px solid var(--color-border-tertiary)"><td>${it.pic}</td><td>${it.tanggal}</td><td>#${it.slot}</td><td><b>${it.headline}</b></td></tr>`;
  });
  h += '</table></div>';
  document.getElementById('capPreview').innerHTML = h;

  // Sync to GAS
  const CHUNK = 5;
  for(let i=0; i<items.length; i+=CHUNK){
    const chunk = items.slice(i, i+CHUNK);
    const p = encodeURIComponent(JSON.stringify(chunk));
    const url = GAS_URL + (GAS_URL.includes('?')?'&':'?') + 'action=saveCaptions&data=' + p;
    status.textContent = `Syncing ${i+CHUNK}/${items.length}...`;
    try {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        const cb = 'cb' + Date.now() + Math.floor(Math.random()*1000);
        window[cb] = (r) => { document.body.removeChild(s); res(r); };
        s.src = url + '&callback=' + cb;
        s.onerror = () => { document.body.removeChild(s); rej(); };
        document.body.appendChild(s);
      });
    } catch(e) { console.error('Sync Error', e); }
  }

  btn.disabled = false;
  status.textContent = 'Berhasil disinkronkan ke Google Sheets!';
}

function initCaptionEngine(){
  const dateGrid = document.getElementById('capDateGrid');
  for(let d=1; d<=31; d++){
    const lbl = (d<10?'0':'')+d+' Mei';
    const btn = document.createElement('button');
    btn.className = 'nb';
    btn.textContent = lbl;
    btn.onclick = () => btn.classList.toggle('on');
    dateGrid.appendChild(btn);
  }
  document.getElementById('capProdGrid').innerHTML = PRODUCTS.map(p => `<button class="nb" onclick="this.classList.toggle('on')">${p.label}</button>`).join('');
}

function selAllDates(){ document.querySelectorAll('#capDateGrid .nb').forEach(b=>b.classList.add('on')); }
function clrAllDates(){ document.querySelectorAll('#capDateGrid .nb').forEach(b=>b.classList.remove('on')); }

initCaptionEngine();
buildStatRow();

</script>
